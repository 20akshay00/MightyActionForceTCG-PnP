<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400">
  <style>
    .sb-title { font: 22px GrilledCheese; fill: #fff; }
    .sb-how { font: 16px BillySerif; fill: #3a2a10; }
    .sb-win { font: 15px GrilledCheese; fill: #7d2034; }
    .sb-clip { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="1.5" y="1.5" width="277" height="397" rx="16" fill="#d9a83c" stroke="#4a3209" stroke-width="3"/>
  <rect x="7" y="7" width="266" height="386" rx="12" fill="none" stroke="#f3d27a" stroke-width="2"/>
  <rect x="13" y="13" width="254" height="374" rx="9" fill="#fde8b4"/>
  <path d="M13 22 a9 9 0 0 1 9 -9 h236 a9 9 0 0 1 9 9 v38 h-254 z" fill="#7d2034"/>
  <text x="140" y="46" text-anchor="middle" class="sb-title">SCOREBOARD</text>
  <g transform="translate(0 -18) rotate(-18 140 200)">
    <path class="sb-clip" d="M123 268 V132 a17 17 0 0 1 34 0 V250 a12 12 0 0 1 -24 0 V148" stroke="#5b616b" stroke-width="9"/>

<div class="in">
  <ol class="steps">
    <li><b>Draw 1</b> card.</li>
    <li><b>Play 1</b> card face-down:</li>
  </ol>
  <div class="table">
    <div class="slot">ATTACK</div><div class="tc">turn<br>card</div><div class="slot">BOUNTY</div>
